name: Deploy AI Worker to Cloudflare

on:
  # Ручной запуск: публикация или откат на конкретную версию.
  workflow_dispatch:
    inputs:
      action:
        description: 'Операция с AI Worker'
        type: choice
        options: [deploy, rollback]
        default: deploy
      version_id:
        description: 'Cloudflare version ID (только для rollback)'
        required: false
        type: string
      confirmation:
        description: 'Введите ROLLBACK для подтверждения отката'
        required: false
        type: string
  # Автопубликация при изменениях исходников Worker в main.
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "worker/wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: cloudflare-ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Detect Worker source changes
        id: changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" | grep -Eq '^worker/'; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
            echo "No Worker source changes; skipping Cloudflare deployment."
          fi
      - name: Validate Cloudflare credentials
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.worker == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets before deploying."
            exit 1
          fi
      - name: Publish AI Worker
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.worker == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config worker/wrangler.jsonc
      - name: Проверить Worker после публикации
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.worker == 'true' }}
        env:
          SITE_URL: https://marcostavar24633-cyber.github.io/unique-design-studio/
          WORKER_URL: https://unique-design-studio-ai.marcostavar24633.workers.dev
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            if node scripts/ops/health-check.mjs --worker-only; then
              echo "Post-deploy health checks passed."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Post-deploy health checks failed."
          exit 1

  rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' && inputs.confirmation == 'ROLLBACK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Проверить version ID
        env:
          VERSION_ID: ${{ github.event.inputs.version_id }}
        run: |
          [[ "$VERSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || {
            echo "::error::Укажите корректный Cloudflare version UUID."
            exit 1
          }
      - name: Проверить Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Не задан CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Не задан CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Откатить Worker на указанную версию
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ github.event.inputs.version_id }}
        run: npx --yes wrangler@4 rollback "$VERSION_ID" --config worker/wrangler.jsonc --message "Guarded rollback via GitHub Actions"
      - name: Проверить Worker после отката
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            if curl --fail --silent --show-error --max-time 10 https://unique-design-studio-ai.marcostavar24633.workers.dev/health | grep -q '"ok":true'; then
              echo "Worker health check passed after rollback."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Worker health check failed after rollback."
          exit 1

  reject-rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' && inputs.confirmation != 'ROLLBACK' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Откат отменён: подтверждение должно быть ровно ROLLBACK."
          exit 1
