name: Deploy AI Worker to staging

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate configuration or deploy the private staging Worker
        type: choice
        required: true
        default: validate
        options:
          - validate
          - deploy

permissions:
  contents: read

concurrency:
  group: cloudflare-ai-worker-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate staging bundle
        run: npx --yes wrangler@4 deploy --dry-run --config config/wrangler.ai-staging.json
      - name: Deploy private staging Worker
        if: ${{ inputs.operation == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID}"
          npx --yes wrangler@4 deploy --config config/wrangler.ai-staging.json
