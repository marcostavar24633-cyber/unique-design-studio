name: Design Director CI

on:
  push:
    branches:
      - feature/design-director-engine
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax and run tests
        run: npm run check
