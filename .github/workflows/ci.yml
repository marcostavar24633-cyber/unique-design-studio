name: CI
on:
  # Проверки PR выполняются через pull_request; push нужен только после слияния в main.
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run build
  workers-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Проверяем оба независимых Worker-конфига без публикации и без Cloudflare-секретов.
      - run: npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.jsonc
      - run: npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.toml
      # Validate the private staging Worker configuration without deploying or invoking AI.
      - run: npx --yes wrangler@4 deploy --dry-run --config config/wrangler.ai-staging.json
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npm run install:e2e-browser
      - run: npm run test:e2e

