name: Project context guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-context-update:
    name: Require PROJECT_CONTEXT.md update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check project changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "$changed"
          if ! grep -Eq '^(src/|worker/|tests/|package\.json|package-lock\.json|wrangler\.toml|vite\.config\.)' <<< "$changed"; then
            echo "No tracked product/code changes; context update is not required."
            exit 0
          fi
          if ! grep -Fxq 'PROJECT_CONTEXT.md' <<< "$changed"; then
            echo "::error::Update PROJECT_CONTEXT.md in the same PR with the implementation, verification results, and remaining work."
            exit 1
          fi
          echo "PROJECT_CONTEXT.md is included."
