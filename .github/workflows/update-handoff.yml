name: Update project handoff

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "PROJECT_HANDOFF.md"

permissions:
  contents: write

concurrency:
  group: handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh Git metadata
        run: node scripts/update-handoff.mjs
      - name: Commit handoff update
        run: |
          if git diff --quiet -- PROJECT_HANDOFF.md; then
            echo "Handoff metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_HANDOFF.md
          git commit -m "docs: refresh project handoff"
          git push
