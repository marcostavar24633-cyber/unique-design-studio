name: Health Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      ai_probe:
        description: 'Выполнить один синтетический запрос Workers AI (расходует квоту)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: uds-health-monitor
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # --ai already runs the baseline health checks; avoid duplicate requests.
      - name: Проверка сайта, Worker и AI binding
        if: github.event.schedule != '17 6 * * *' && github.event.inputs.ai_probe != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ops/health-check.mjs
      - name: Синтетическая проверка AI inference
        if: github.event.schedule == '17 6 * * *' || github.event.inputs.ai_probe == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ops/health-check.mjs --ai
